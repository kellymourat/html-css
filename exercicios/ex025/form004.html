<!DOCTYPE html>
<html lang="pt-br">
<head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Formulário</title>
                 <style>
                    body {
                        font-family: Arial, Helvetica, sans-serif;
                        background-color: darkgray;

                    }
                </style>
</head>
<body>
                <h1>Exemplo de fomulário</h1>
                <form action="cadastro.php" method="post">
                    
                    <fieldset>
                    <legend>Dados Pessoais</legend>
                        <p>
                            <label for="inome">Nome</label>
                            <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>        
                        </p>
                        <p>
                                <label for="iemail">E-mail</label>
                                <input type="email" name="email" id="iemail" autocomplete="email" required>
                        </p>
                        <p>
                            <label for="itel">Telefone</label>
                            <input type="tel" name="itel" id="telefone" autocomplete="tel" pattern="^\(\d{2}\) \d{4,5}-\d{4}$" placeholder="(xx)xxxx-xxxx">  <!--Formula para capturar dados de telefone-->
                        </p>
                    </fieldset>
                    <!--Estudar mais sobre regEx Expressão regular-->
                    <p>
                       <input type="submit" value="Enviar">
                       <input type="reset" value="Limpar">
                    </p>            
                </form>
                
</body>
</html>
