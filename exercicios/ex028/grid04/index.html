<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout, propriedades simplificadas.</title>
  <style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: black;
        color: white;

    }
      div.container {
        border: 3px solid  white;
        display: grid;
        grid-template-rows: repeat(3, 80px); /* divide em frações*/
        grid-template-columns: 30px 30% repeat(2, 1fr);
       /* grid-template-columns: 4fr repeat(2, 1fr); */
       /* grid-template-columns: repeat(2, 1fr) 4fr; */
       /* grid-template-columns: 1fr 2fr 1fr;  divide em frações*/
        grid-auto-flow: row;
        grid-auto-rows: 80px; /* confg para grid implícido*/
        grid-auto-columns: 120px; 
        gap: 10px; /* espaçamento entre os grid line*/
        place-items: normal normal;
        place-content: normal normal;
      }

      div.item {
        border: 3px solid plum;
        padding: 5px;

      }
  </style>
</head>
<body>
    <div class="container">
         <div class="item">A</div>
         <div class="item">B</div>
         <div class="item">C</div>
         <div class="item">D</div>
         <div class="item">E</div>
         <div class="item">F</div>
         <div class="item">G</div>
         <div class="item">H</div>
         <div class="item">I</div>
         <div class="item">J</div>    
    </div>       
</body>
</html>
